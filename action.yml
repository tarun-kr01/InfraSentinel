name: InfraSentinel
description: Scan a Terraform JSON plan for policy violations and blast radius
inputs:
  plan:
    description: Path to terraform show -json output
    required: true
    default: plan.json
  config:
    description: Optional InfraSentinel YAML configuration
    required: false
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        python -m pip install "${{ github.action_path }}"
    - shell: bash
      id: scan
      env:
        PLAN: ${{ inputs.plan }}
        CONFIG: ${{ inputs.config }}
      run: |
        set +e
        if [ -n "$CONFIG" ]; then
          python -m infrasentinel.cli scan --plan "$PLAN" --config "$CONFIG" > infrasentinel-result.json
        else
          python -m infrasentinel.cli scan --plan "$PLAN" > infrasentinel-result.json
        fi
        status=$?
        cat infrasentinel-result.json
        python - <<'PY'
        import json
        from pathlib import Path
        result = json.loads(Path("infrasentinel-result.json").read_text())
        body = "<!-- infrasentinel-sticky -->\n## InfraSentinel\n\n" + result["summary"] + "\n\n"
        for finding in result["findings"]:
            body += f"- **{finding['severity']}** `{finding['rule']}` `{finding['address']}`: {finding['message']}\n"
        Path("infrasentinel-comment.md").write_text(body)
        PY
        if [ -n "${GITHUB_TOKEN:-}" ] && [ -n "${{ github.event.pull_request.number }}" ]; then
          comment_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" --jq '.[] | select(.body | contains("<!-- infrasentinel-sticky -->")) | .id' | head -n 1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/$comment_id" -f body="$(cat infrasentinel-comment.md)" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" -f body="$(cat infrasentinel-comment.md)" >/dev/null
          fi
        fi
        exit "$status"
