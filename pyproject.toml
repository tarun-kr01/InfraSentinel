[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infrasentinel"
version = "0.1.0"
description = "Deterministic Terraform plan risk analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "networkx>=3.1",
  "PyYAML>=6.0",
  "typer>=0.9",
]

[project.scripts]
infrasentinel = "infrasentinel.cli:app"

[tool.setuptools.packages.find]
include = ["infrasentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
